<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2a1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="予備論文">
<title>予備論文 論点トレ</title>
<style>
:root{color-scheme:light;--ink:#1d2520;--muted:#6a756e;--line:#e1e7e2;--paper:#f4f6f4;--navy:#1c2a1f;--green:#16834a;--red:#c43d3d;--amber:#c9871b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
h1{font-size:19px;margin:0;font-weight:750}header small{opacity:.75}
main{max-width:720px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:7px}
select,button{font:inherit}select{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
button{border:0;border-radius:12px;padding:14px 12px;font-weight:700;cursor:pointer}
.primary{background:var(--navy);color:#fff}.secondary{background:#edf1ee;color:var(--ink)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
button:disabled{opacity:.4}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:10px}
.progress{height:5px;background:#e6ece8;border-radius:9px;overflow:hidden;margin-bottom:14px}.bar{height:100%;background:var(--green);width:0}
.chip{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:700;margin:0 6px 8px 0}
.chip.hot{background:var(--amber)}.chip.sub{background:#e3e9e4;color:var(--ink);font-weight:600}
.qtext{font-size:16px;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:14px}
.sec{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.sec h3{font-size:14px;margin:0 0 8px;color:var(--navy)}
.pt{background:#f7faf8;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pt b{font-size:15px}.pt .n{font-size:14px;line-height:1.85;margin-top:6px;white-space:pre-wrap}.pt .r{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.intent{font-size:14px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.cases{font-size:13px;line-height:1.7;padding-left:18px;margin:6px 0}
.note{font-size:12px;color:var(--muted);line-height:1.7}
.rate button{padding:14px 4px;font-size:14px;border:2px solid var(--line);background:#fff}
.rate .ok{color:var(--green);border-color:#bfe3cf}.rate .mid{color:var(--amber);border-color:#f1dcae}.rate .ng{color:var(--red);border-color:#f0c7c7}
.hidden{display:none!important}.subtle{font-size:12px;color:var(--muted);line-height:1.7}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.star{font-size:20px;cursor:pointer;padding:4px 8px;background:none}
.sttable{width:100%;border-collapse:collapse;font-size:13px}.sttable th{font-weight:600;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}.sttable th:first-child,.sttable td:first-child{text-align:left}
.sttable td{padding:9px 4px;border-bottom:1px solid #eef1ee;text-align:right}
.linkbtn{background:none;color:var(--muted);font-weight:500;font-size:12px;text-decoration:underline;padding:10px 4px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:10px}
#error{border-color:#e6b8b8;color:#8a2a2a;white-space:pre-wrap}
</style>
</head>
<body>
<header><h1>予備論文 論点トレ</h1><small>問題を見る・論点と規範を思い出す・答えを確認　<span id="ver">v003</span></small></header>
<main>
<section id="error" class="panel hidden"></section>
<section id="setup" class="panel">
  <h2 style="font-size:17px;margin:0 0 16px">学習条件を選択</h2>
  <label for="subject">科目</label><select id="subject"></select>
  <div style="height:14px"></div>
  <label for="year">年度</label><select id="year"></select>
  <div style="height:14px"></div>
  <label for="mode">出題</label>
  <select id="mode">
    <option value="mix">頻出論点を優先（おすすめ）</option>
    <option value="random">ランダム</option>
    <option value="normal">年度順（新しい順）</option>
    <option value="weak">あやふや・出てこなかった</option>
    <option value="unseen">未学習のみ</option>
    <option value="favorites">★お気に入り</option>
  </select>
  <div style="height:14px"></div>
  <label for="count">問数</label>
  <select id="count"><option value="10">10問</option><option value="20">20問</option><option value="0">全部</option></select>
  <div style="height:18px"></div>
  <button id="start" class="primary" style="width:100%">開始</button>
  <div id="avail" class="subtle" style="margin-top:10px"></div>
  <div class="row" style="margin-top:6px"><button id="showstats" class="linkbtn">科目別の習熟度を見る</button><button id="resetrec" class="linkbtn">記録をリセット</button></div>
</section>
<section id="stats" class="panel hidden"><h2 style="font-size:17px;margin:0 0 12px">科目別の習熟度</h2><div id="statsbody"></div><button id="statsback" class="secondary" style="width:100%;margin-top:14px">戻る</button></section>
<section id="quiz" class="panel hidden">
  <div class="meta"><span id="pos"></span><span id="score"></span></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="topline"><div id="chips"></div><button class="star" id="fav" aria-label="お気に入り">☆</button></div>
  <div class="qtext" id="qtext"></div>
  <button id="reveal" class="primary" style="width:100%">答え（論点・規範）を見る</button>
  <div id="answer" class="hidden">
    <div class="sec"><h3>論点と規範</h3><div id="points"></div></div>
    <div class="sec hidden" id="anssec"><h3>参考解答（骨子）</h3><div class="intent" id="refans"></div></div>
    <div class="sec"><h3>出題趣旨（法務省・原文）</h3><div class="intent" id="intent"></div><ul class="cases" id="cases"></ul></div>
    <div class="sec" id="excelsec"><h3>参考：論点メモ（Excel整理）</h3><div class="note" id="excel"></div></div>
    <div class="sec rate"><div class="subtle" style="margin-bottom:8px">自分の答案（頭の中）はどうだった？</div>
      <div class="row"><button class="ok" data-r="2">書けた</button><button class="mid" data-r="1">あやふや</button><button class="ng" data-r="0">出てこない</button></div></div>
  </div>
  <div class="row hidden" id="navrow" style="margin-top:14px"><button class="secondary" id="skip">次へ</button></div>
</section>
<section id="done" class="panel hidden"><h2 style="font-size:19px;margin:0 0 8px">終了</h2><div id="summary" style="line-height:1.9"></div><button id="again" class="primary" style="width:100%;margin-top:14px">もう一度設定する</button></section>
</main>
<footer>問題文・出題趣旨：法務省公表資料　／　論点・規範：学習用に別途作成</footer>
<script>
const VER="v003";document.getElementById("ver").textContent=VER;
const $=id=>document.getElementById(id);
window.QDATA=null;window.RDATA=[];
const KEY={rec:"ron-rec-v1",fav:"ron-fav-v1",log:"ron-log-v1"};
function ld(k,d){try{return JSON.parse(localStorage.getItem(k)||"")||d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const SUBJ=[["CONST","憲法"],["ADMIN","行政法"],["CIVIL","民法"],["COMM","商法"],["CIVPRO","民事訴訟法"],["CRIMINAL","刑法"],["CRIMPRO","刑事訴訟法"],["PRACCIV","実務基礎（民事）"],["PRACCRIM","実務基礎（刑事）"]];
const CORE=SUBJ.slice(0,9).map(x=>x[0]);
const SNAME=Object.fromEntries(SUBJ);
let rec=ld(KEY.rec,{}),fav=ld(KEY.fav,{}),log=ld(KEY.log,{});
let ALL=[],queue=[],idx=0,session={ok:0,mid:0,ng:0};
const yr=n=>n;
function candidates(){const a=[];for(let i=10;i>=1;i--)a.push("R"+String(i).padStart(2,"0"));for(let i=30;i>=23;i--)a.push("H"+i);return a}
function loadYear(name){return new Promise(res=>{const s=document.createElement("script");s.src="data/"+name+".js?v=3";s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s)})}
function rank(it){return(it.id[0]==="R"?100:50)+parseInt(it.id.slice(1,3),10)*(it.id[0]==="R"?1:1)}
async function init(){
  await Promise.all(candidates().map(loadYear));
  ALL=(window.RDATA||[]).slice().sort((a,b)=>rank(b)-rank(a));
  if(!ALL.length){const e=$("error");e.classList.remove("hidden");e.textContent="データが読み込めませんでした。data/ フォルダを確認してください。";return}
  const sub=$("subject");sub.innerHTML="";
  const present=new Set(ALL.map(x=>x.subject_id));
  [["__core","全科目（基本7科目＋実務基礎）"],...SUBJ.filter(s=>present.has(s[0]))].forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;sub.appendChild(o)});
  const ys=[...new Set(ALL.map(x=>x.year))];
  const y=$("year");y.innerHTML='<option value="">すべての年度</option>'+ys.map(v=>`<option>${v}</option>`).join("");
  sub.onchange=y.onchange=$("mode").onchange=avail;avail();
}
function pool(){
  const s=$("subject").value,y=$("year").value,m=$("mode").value;
  return ALL.filter(q=>(s==="__core"?CORE.includes(q.subject_id):s==="__all"?true:s==="__sel"?!CORE.includes(q.subject_id):q.subject_id===s)&&(!y||q.year===y)&&
   (m==="weak"?(rec[q.id]&&rec[q.id].last<2):m==="unseen"?!rec[q.id]:m==="favorites"?fav[q.id]:true));
}
function avail(){$("avail").textContent=`該当 ${pool().length}問（全${ALL.length}問）`}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function weight(q){const r=rec[q.id];let w=1+(q.hot>=3?1:0)+(q.hot>=6?1:0);if(!r)w*=2;else w*=[3,2,1][r.last];return w}
function weighted(p,n){const a=p.slice(),out=[];while(a.length&&out.length<n){let t=a.reduce((s,q)=>s+weight(q),0),r=Math.random()*t,i=0;for(;i<a.length-1;i++){r-=weight(a[i]);if(r<0)break}out.push(a.splice(i,1)[0])}return out}
$("start").onclick=()=>{
  let p=pool();if(!p.length){alert("該当する問題がありません");return}
  const m=$("mode").value,n=+$("count").value||p.length;
  queue=m==="mix"?weighted(p,n):m==="normal"?p.slice(0,n):shuffle(p.slice()).slice(0,n);
  idx=0;session={ok:0,mid:0,ng:0};
  ["setup","stats","done"].forEach(i=>$(i).classList.add("hidden"));$("quiz").classList.remove("hidden");show();
};
function show(){
  const q=queue[idx];
  $("pos").textContent=`${idx+1} / ${queue.length}`;$("score").textContent=`書けた ${session.ok}　あやふや ${session.mid}　出ず ${session.ng}`;
  $("bar").style.width=(idx/queue.length*100)+"%";
  const r=rec[q.id];
  $("chips").innerHTML=`<span class="chip">${q.year}</span><span class="chip sub">${SNAME[q.subject_id]||q.subject}</span>`+(q.hot>=3?'<span class="chip hot">頻出論点</span>':'')+(r?`<span class="chip sub">${["出てこない","あやふや","書けた"][r.last]}（${r.n}回）</span>`:"");
  $("fav").textContent=fav[q.id]?"★":"☆";
  $("qtext").textContent=q.text;
  $("answer").classList.add("hidden");$("reveal").classList.remove("hidden");$("navrow").classList.add("hidden");
  window.scrollTo(0,0);
}
$("reveal").onclick=()=>{
  const q=queue[idx];
  const P=$("points");P.innerHTML="";
  if(q.points&&q.points.length){q.points.forEach(p=>{const d=document.createElement("div");d.className="pt";const b=document.createElement("b");b.textContent=p.t;d.appendChild(b);const n=document.createElement("div");n.className="n";n.textContent=p.n;d.appendChild(n);if(p.r){const r=document.createElement("div");r.className="r";r.textContent="根拠："+p.r;d.appendChild(r)}P.appendChild(d)});
    if(q.note){const d=document.createElement("div");d.className="note";d.textContent=q.note;P.appendChild(d)}}
  else{const d=document.createElement("div");d.className="note";d.textContent="この問題の論点・規範は準備中です。下の出題趣旨（法務省・原文）で確認してください。";P.appendChild(d)}
  $("refans").textContent=q.answer||"";$("anssec").classList.toggle("hidden",!q.answer);
  $("intent").textContent=q.intent||"（出題趣旨なし）";
  const c=$("cases");c.innerHTML="";(q.cases||[]).forEach(t=>{const li=document.createElement("li");li.textContent=t;c.appendChild(li)});
  $("excel").textContent=q.excel?q.excel+(q.hot_label?"\n頻出ランキング上の関連：「"+q.hot_label+"」（科目内集計の出題回数 "+q.hot+"）":""):"（なし）";
  $("excelsec").classList.toggle("hidden",!q.excel);
  $("answer").classList.remove("hidden");$("reveal").classList.add("hidden");
  $("answer").scrollIntoView({behavior:"smooth",block:"start"});
};
document.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{
  const q=queue[idx],v=+b.dataset.r;
  const r=rec[q.id]||{n:0,c:0,last:0,t:0};r.n++;if(v===2)r.c++;r.last=v;r.t=Date.now();rec[q.id]=r;sv(KEY.rec,rec);
  const dt=new Date(Date.now()+9*36e5).toISOString().slice(0,10);log[dt]=log[dt]||{};const L=log[dt][q.subject_id]=log[dt][q.subject_id]||{n:0,c:0};L.n++;if(v===2)L.c++;
  const ks=Object.keys(log).sort();while(ks.length>200)delete log[ks.shift()];sv(KEY.log,log);
  if(v===2)session.ok++;else if(v===1)session.mid++;else session.ng++;
  next();
});
function next(){idx++;if(idx>=queue.length){$("quiz").classList.add("hidden");$("done").classList.remove("hidden");$("summary").innerHTML=`書けた ${session.ok}　あやふや ${session.mid}　出てこない ${session.ng}`;return}show()}
$("fav").onclick=()=>{const q=queue[idx];if(fav[q.id])delete fav[q.id];else fav[q.id]=1;sv(KEY.fav,fav);$("fav").textContent=fav[q.id]?"★":"☆"};
$("again").onclick=()=>{$("done").classList.add("hidden");$("setup").classList.remove("hidden");avail()};
$("showstats").onclick=()=>{
  const rows=SUBJ.map(([id,nm])=>{const items=ALL.filter(q=>q.subject_id===id);if(!items.length)return"";let st=0,ok=0;items.forEach(q=>{const r=rec[q.id];if(r){st++;if(r.last===2)ok++}});
    const np=items.filter(q=>q.points&&q.points.length).length;
    return `<tr><td>${nm}</td><td>${st}/${items.length}</td><td>${st?Math.round(ok/st*100)+"%":"-"}</td><td>${np}</td></tr>`}).join("");
  $("statsbody").innerHTML=`<table class="sttable"><tr><th>科目</th><th>学習済</th><th>直近「書けた」</th><th>規範あり</th></tr>${rows}</table>`;
  $("setup").classList.add("hidden");$("stats").classList.remove("hidden");
};
$("statsback").onclick=()=>{$("stats").classList.add("hidden");$("setup").classList.remove("hidden")};
$("resetrec").onclick=()=>{if(confirm("学習記録を全部消しますか？")){rec={};fav={};log={};sv(KEY.rec,rec);sv(KEY.fav,fav);sv(KEY.log,log);avail()}};
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(r.active&&r.active.scriptURL.endsWith("/sw.js"))r.unregister()})).catch(()=>{});navigator.serviceWorker.register("app-sw.js").catch(()=>{})}
init();
</script>
</body>
</html>
